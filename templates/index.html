<!DOCTYPE html>
<html>
<head>
    <title>24/7 Stream Controller</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .status-box { padding: 15px; margin-bottom: 20px; border-radius: 5px; background: #f0f0f0; }
        .status-streaming { background: #d4edda; color: #155724; }
        .status-starting { background: #cce5ff; color: #004085; }
        .status-downloading { background: #fff3cd; color: #856404; }
        .status-error { background: #f8d7da; color: #721c24; }
        input { width: 100%; padding: 8px; margin: 5px 0 15px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        #startBtn { background: #007bff; color: white; border: none; }
        #stopBtn { background: #dc3545; color: white; border: none; }
        #startBtn:disabled { background: #a0c4ff; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>YouTube 24/7 Control Panel</h1>
    
    <div id="statusBox" class="status-box">
        <strong>Status:</strong> <span id="statusText">Checking...</span><br>
        <small id="statusMessage"></small>
    </div>

    <form id="startForm">
        <label>Dropbox Video Link:</label>
        <input type="url" id="dropbox_link" required>
        <label>YouTube Stream Key:</label>
        <input type="password" id="stream_key" required>
        <button type="submit" id="startBtn">START STREAM</button>
    </form>
    
    <button id="stopBtn">STOP STREAM</button>

    <script>
        async function updateStatus() {
            try {
                let res = await fetch('/status');
                if(res.status === 401) { location.reload(); return; }
                let data = await res.json();
                
                let box = document.getElementById('statusBox');
                document.getElementById('statusText').innerText = data.status.toUpperCase();
                document.getElementById('statusMessage').innerText = data.message;
                
                box.className = 'status-box';
                if(data.status === 'streaming') box.classList.add('status-streaming');
                if(data.status === 'starting') box.classList.add('status-starting');
                if(data.status === 'downloading') box.classList.add('status-downloading');
                if(data.status === 'error') box.classList.add('status-error');
                
                document.getElementById('startBtn').disabled = (data.status === 'downloading' || data.status === 'starting' || data.status === 'streaming');
            } catch (e) {
                console.error("Status fetch failed", e);
            }
        }

        document.getElementById('startForm').onsubmit = async (e) => {
            e.preventDefault();
            let formData = new FormData();
            formData.append('dropbox_link', document.getElementById('dropbox_link').value);
            formData.append('stream_key', document.getElementById('stream_key').value);
            
            let res = await fetch('/start', { method: 'POST', body: formData });
            let data = await res.json();
            if(!res.ok) {
                alert(data.error || 'Failed to start stream.');
            }
            updateStatus();
        };

        document.getElementById('stopBtn').onclick = async () => {
            if(confirm('Are you sure you want to stop the stream?')) {
                await fetch('/stop', { method: 'POST' });
                updateStatus();
            }
        };

        setInterval(updateStatus, 3000);
        updateStatus();
    </script>
</body>
</html>
